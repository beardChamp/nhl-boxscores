<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NHL Boxscores</title>
        <style rel="stylesheet" type="text/css">
            @font-face {
                font-family: 'Figtree';
                src: url('type/Figtree-Regular.woff2') format('woff2');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'FigtreeLight';
                src: url('type/Figtree-Light.woff2') format('woff2');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'FigtreeMedium';
                src: url('type/Figtree-Medium.woff2') format('woff2');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'FigtreeBold';
                src: url('type/Figtree-Bold.woff2') format('woff2');
                font-weight: normal;
                font-style: normal;
            }
            body {
                background-color: white;
                color: black;
                font: normal 1rem/1.5rem 'Figtree', sans-serif;
            }
            h1 {
                font-family: 'FigtreeLight', sans-serif;
                font-weight: normal;
                padding: 0 2.25rem;
            }
            ul {
                padding: 0;
            }
            li {
                list-style-type: none;
                margin: 0;
                padding: 1rem 1.5rem;
            }
            dl {
                display: flex;
                margin-bottom: 0.5rem;
            }
            dt {
                min-width: 12.5rem;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>NHL Boxscores</h1>
        </header>
        <main class="data-container">
            <score-base></score-base>
        </main>
        <script type="module">
            import './js/components/score-base.js';
            import './js/components/game-block.js';
            import './js/components/date-nav.js';
        </script>
    </body>
</html>
